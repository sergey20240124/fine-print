name: daily scan

on:
  schedule:
    - cron: '0 5 * * *'      # 05:00 UTC — 08:00 по Киеву
  workflow_dispatch:          # и вручную кнопкой в Actions
  push:
    branches: [main]

permissions:
  contents: write             # чтобы коммитить свежий снимок
  pages: write                # чтобы публиковать
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Обновить снимок рынков
        # На push-запуске данные не трогаем: пересобирать имеет смысл
        # только по расписанию и вручную.
        if: github.event_name != 'push'
        run: node scripts/update.mjs

      - name: Закоммитить, если что-то изменилось
        if: github.event_name != 'push'
        run: |
          git config user.name  "fine-print-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets.json
          if git diff --cached --quiet -- data/markets.json; then
            echo "изменений нет — коммит не нужен"
          else
            git commit -m "скан: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Отбор случая Бёрри
        # Стадии A и B работают всегда; стадия C (резолвер) — только если
        # в секретах репозитория лежит ANTHROPIC_API_KEY. Без ключа шортлист
        # останется пустым: отказ по умолчанию, а не пропуск проверки.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: node scripts/screen.mjs

      - name: Закоммитить шортлист
        if: github.event_name != 'push'
        run: |
          # git diff --quiet НЕ видит неотслеживаемые файлы и всегда успешен
          # для нового файла — поэтому сначала add, потом проверка индекса.
          git config user.name  "fine-print-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shortlist.json
          if git diff --cached --quiet -- data/shortlist.json; then
            echo "шортлист не изменился"
          else
            git commit -m "отбор: $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
