name: calibrate

# Диагностика, а не расписание: отвечает на вопрос «планка верная или
# недостижимая». Запускается руками, когда шортлист долго пуст.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Сколько закрытых рынков взять в выборку'
        default: '150'
      resolver:
        description: 'Гонять ли стадию C (платно, нужен ANTHROPIC_API_KEY)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Прогнать ворота на чисто разрешившихся рынках
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          CALIBRATE_RESOLVER: ${{ inputs.resolver && '1' || '0' }}
        run: node scripts/calibrate.mjs ${{ inputs.sample }}

      - name: Закоммитить результат
        run: |
          # git diff --quiet не видит неотслеживаемые файлы: сначала add,
          # потом проверка индекса, иначе новый файл никогда не коммитится
          git config user.name  "fine-print-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibration.json
          if git diff --cached --quiet -- data/calibration.json; then
            echo "калибровка не изменилась"
          else
            git commit -m "калибровка: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Коммит, сделанный GITHUB_TOKEN, намеренно не запускает другие
      # workflow — иначе была бы рекурсия. Значит update.yml сюда не
      # придёт, и публиковать страницу надо в этом же прогоне.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: calibrate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
