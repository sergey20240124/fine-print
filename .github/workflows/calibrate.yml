name: calibrate

# Диагностика, а не расписание: отвечает на вопрос «планка верная или
# недостижимая». Запускается руками, когда шортлист долго пуст.

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'Сколько закрытых рынков взять в выборку'
        default: '150'
      resolver:
        description: 'Гонять ли стадию C (платно, нужен ANTHROPIC_API_KEY)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Прогнать ворота на чисто разрешившихся рынках
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
          CALIBRATE_RESOLVER: ${{ inputs.resolver && '1' || '0' }}
        run: node scripts/calibrate.mjs ${{ inputs.sample }}

      - name: Закоммитить результат
        run: |
          if git diff --quiet -- data/calibration.json; then
            echo "калибровка не изменилась"
          else
            git config user.name  "fine-print-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/calibration.json
            git commit -m "калибровка: $(date -u +%Y-%m-%d)"
            git push
          fi
